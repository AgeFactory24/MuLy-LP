<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="推しが本気">
  <defs>
    <clipPath id="oshi-clip"><circle cx="120" cy="120" r="120"></circle></clipPath>
    <filter id="oshi-blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
    <filter id="oshi-blur28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8"></feGaussianBlur></filter>
    <filter id="oshi-blur6" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
    <filter id="oshi-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF3B6B" flood-opacity="0.6"></feDropShadow>
    </filter>
    <radialGradient id="oshi-glow">
      <stop offset="0%" stop-color="#FF3B6B" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#FF3B6B" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#FF3B6B" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="oshi-neonTint">
      <stop offset="0%" stop-color="#FF3B6B" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#FF3B6B" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <g filter="url(#oshi-shadow)">
    <g clip-path="url(#oshi-clip)">
      <circle cx="120" cy="120" r="120" fill="#000"></circle>
      <circle cx="120" cy="120" r="120" fill="url(#oshi-neonTint)"></circle>
      <g id="oshi-art"></g>
    </g>
  </g>
  
</svg>