<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="固定リスナー">
  <defs>
    <clipPath id="loyal-clip"><circle cx="120" cy="120" r="120"></circle></clipPath>
    <filter id="loyal-blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
    <filter id="loyal-blur28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8"></feGaussianBlur></filter>
    <filter id="loyal-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4A8CFF" flood-opacity="0.6"></feDropShadow>
    </filter>
    <radialGradient id="loyal-glow">
      <stop offset="0%" stop-color="#4A8BFF" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#4A8BFF" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#4A8BFF" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="loyal-neonTint">
      <stop offset="0%" stop-color="#4A8CFF" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#4A8CFF" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <g filter="url(#loyal-shadow)">
    <g clip-path="url(#loyal-clip)">
      <circle cx="120" cy="120" r="120" fill="#000"></circle>
      <circle cx="120" cy="120" r="120" fill="url(#loyal-neonTint)"></circle>
      <g id="loyal-art"></g>
    </g>
  </g>
  
</svg>