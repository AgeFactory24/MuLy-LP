<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="懐古リスナー">
  <defs>
    <clipPath id="nost-clip"><circle cx="120" cy="120" r="120"></circle></clipPath>
    <filter id="nost-blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
    <filter id="nost-blur28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8"></feGaussianBlur></filter>
    <filter id="nost-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFB55C" flood-opacity="0.6"></feDropShadow>
    </filter>
    <radialGradient id="nost-glow">
      <stop offset="0%" stop-color="#FFB55C" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#FFB55C" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#FFB55C" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="nost-neonTint">
      <stop offset="0%" stop-color="#FFB55C" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#FFB55C" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <g filter="url(#nost-shadow)">
    <g clip-path="url(#nost-clip)">
      <circle cx="120" cy="120" r="120" fill="#000"></circle>
      <circle cx="120" cy="120" r="120" fill="url(#nost-neonTint)"></circle>
      <g id="nost-art"></g>
    </g>
  </g>
  
</svg>