<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="レジェンド">
  <defs>
    <clipPath id="legend-clip"><circle cx="120" cy="120" r="120"></circle></clipPath>
    <filter id="legend-blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
    <filter id="legend-blur28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8"></feGaussianBlur></filter>
    <filter id="legend-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFB526" flood-opacity="0.6"></feDropShadow>
    </filter>
    <radialGradient id="legend-glow">
      <stop offset="0%" stop-color="#FFB627" stop-opacity="0.35"></stop>
      <stop offset="60%" stop-color="#FFB627" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#FFB627" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="legend-neonTint">
      <stop offset="0%" stop-color="#FFB526" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#FFB526" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <g filter="url(#legend-shadow)">
    <g clip-path="url(#legend-clip)">
      <circle cx="120" cy="120" r="120" fill="#000"></circle>
      <circle cx="120" cy="120" r="120" fill="url(#legend-neonTint)"></circle>
      <g id="legend-art"></g>
    </g>
  </g>
  
</svg>