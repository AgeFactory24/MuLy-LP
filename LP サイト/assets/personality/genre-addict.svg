<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="ジャンル偏愛家">
  <defs>
    <clipPath id="genre-clip"><circle cx="120" cy="120" r="120"></circle></clipPath>
    <filter id="genre-blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
    <filter id="genre-blur28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.8"></feGaussianBlur></filter>
    <filter id="genre-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F5D140" flood-opacity="0.6"></feDropShadow>
    </filter>
    <radialGradient id="genre-glow">
      <stop offset="0%" stop-color="#F5D040" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#F5D040" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#F5D040" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="genre-neonTint">
      <stop offset="0%" stop-color="#F5D140" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#F5D140" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <g filter="url(#genre-shadow)">
    <g clip-path="url(#genre-clip)">
      <circle cx="120" cy="120" r="120" fill="#000"></circle>
      <circle cx="120" cy="120" r="120" fill="url(#genre-neonTint)"></circle>
      <g id="genre-art"></g>
    </g>
  </g>
  
</svg>