<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuLy — お問い合わせ</title>
<meta name="description" content="MuLyへのご質問、不具合報告、ご要望はこちらからお送りください。">
<link rel="canonical" href="https://muly.club/support">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://muly.club/support">
<meta property="og:title" content="お問い合わせ｜MuLy">
<meta property="og:description" content="MuLyへのご質問、不具合報告、ご要望はこちらからお送りください。">
<meta property="og:image" content="https://muly.club/assets/appicon.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="MuLyアプリアイコン">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="お問い合わせ｜MuLy">
<meta name="twitter:description" content="MuLyへのご質問、不具合報告、ご要望はこちらからお送りください。">
<meta name="twitter:image" content="https://muly.club/assets/appicon.png">
<script src="./support.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { initializeAppCheck, ReCaptchaV3Provider, getToken } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check.js";

  // Firebase Console > プロジェクトの設定 > 全般 で確認できるWebアプリ設定(公開情報)
  const firebaseConfig = {
    projectId: "musiclibrary-lp",
    appId: "1:1017844667020:web:2db2f9b2093116cf55a1a9",
    storageBucket: "musiclibrary-lp.firebasestorage.app",
    apiKey: "AIzaSyAOgh_SoHVEiI9_Gpf0Z77IrJHgsWeeBYU",
    authDomain: "musiclibrary-lp.firebaseapp.com",
    messagingSenderId: "1017844667020",
  };

  // Firebase Console > App Check で発行したreCAPTCHA v3のサイトキーに置き換える
  const RECAPTCHA_SITE_KEY = "6LdlD1stAAAAAOouu6jCx8exq8V5Qim1w2bAf9X7";

  const firebaseApp = initializeApp(firebaseConfig);
  const appCheck = initializeAppCheck(firebaseApp, {
    provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
    isTokenAutoRefreshEnabled: true,
  });

  window.__getAppCheckToken = async () => {
    try {
      const result = await getToken(appCheck, false);
      return result.token;
    } catch (err) {
      console.error("App Check token fetch failed", err);
      return null;
    }
  };
</script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
/* お問い合わせページ専用スタイル。既存LPのクラス名(lp-header等)を再利用しつつ、フォーム関連のクラスは重複しない名前(sp-*)にして分離 */
body{margin:0;background:#f0eee9;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@media (max-width: 1024px) {
  .lp-header{padding:14px 20px !important}
  .lp-nav{gap:18px !important}
  .lp-footer{padding:24px 24px !important}
  .sp-section{padding:56px 24px !important}
}
@media (max-width: 480px) {
  .lp-nav{display:none !important}
  .lp-header{padding:12px 16px !important}
  .sp-section{padding:40px 16px !important}
  .sp-row-2col{grid-template-columns:1fr !important;gap:16px !important}
  .sp-title{font-size:24px !important}
}
</style>
</helmet>

<div style="width:100%;background:{{ theme.bg }};color:{{ theme.text }};font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">

<header class="lp-header" style="position:sticky;top:0;z-index:10;background:{{ theme.bg }};border-bottom:1px solid {{ theme.border }};padding:20px 56px;">
<div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
<a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:{{ theme.text }};">
<img src="assets/appicon.png" alt="MuLy" style="width:32px;height:32px;border-radius:8px;">
<span style="font-weight:700;font-size:17px;letter-spacing:-0.01em;">MuLy</span>
</a>
<div style="display:flex;align-items:center;gap:12px;">
<span style="padding:9px 18px;border-radius:999px;background:{{ theme.accent }};color:#fff;font-size:13px;font-weight:600;">近日公開</span>
</div>
</div>
</header>

<section class="sp-section" style="padding:96px 56px;">
<div style="max-width:560px;margin:0 auto;">

<h1 class="sp-title" style="font-size:30px;font-weight:800;margin:0 0 12px;letter-spacing:-0.01em;">お問い合わせ</h1>
<p style="font-size:15px;line-height:1.7;color:{{ theme.textSecondary }};margin:0 0 40px;">不具合報告・機能要望など、お気軽にお送りください。</p>

<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ handleSubmit }}" style="display:flex;flex-direction:column;gap:24px;">

<div>
<label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">お名前<span style="color:{{ theme.textSecondary }};font-weight:500;">(任意)</span></label>
<input type="text" value="{{ fields.name }}" onChange="{{ onChangeName }}" placeholder="山田 太郎" style="width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid {{ theme.border }};background:{{ theme.card }};color:{{ theme.text }};font-size:15px;font-family:inherit;"/>
</div>

<div>
<label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">メールアドレス<span style="color:{{ theme.accent }};font-weight:700;"> *</span></label>
<input type="email" value="{{ fields.email }}" onChange="{{ onChangeEmail }}" placeholder="you@example.com" style="width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid {{ emailBorder }};background:{{ theme.card }};color:{{ theme.text }};font-size:15px;font-family:inherit;"/>
<sc-if value="{{ errors.email }}" hint-placeholder-val="{{ false }}">
<p style="margin:6px 0 0;font-size:12px;color:#E0405C;">{{ errors.email }}</p>
</sc-if>
</div>

<div>
<label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">お問い合わせ種別<span style="color:{{ theme.accent }};font-weight:700;"> *</span></label>
<select value="{{ fields.category }}" onChange="{{ onChangeCategory }}" style="width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid {{ categoryBorder }};background:{{ theme.card }};color:{{ theme.text }};font-size:15px;font-family:inherit;">
<option value="">選択してください</option>
<option value="bug">不具合報告</option>
<option value="feature">機能要望</option>
<option value="privacy">プライバシーポリシーについて</option>
<option value="other">その他</option>
</select>
<sc-if value="{{ errors.category }}" hint-placeholder-val="{{ false }}">
<p style="margin:6px 0 0;font-size:12px;color:#E0405C;">{{ errors.category }}</p>
</sc-if>
</div>

<div class="sp-row-2col" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
<div>
<label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">アプリバージョン<span style="color:{{ theme.textSecondary }};font-weight:500;">(任意)</span></label>
<input type="text" value="{{ fields.appVersion }}" onChange="{{ onChangeAppVersion }}" placeholder="例: 1.0.0" style="width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid {{ theme.border }};background:{{ theme.card }};color:{{ theme.text }};font-size:15px;font-family:inherit;"/>
</div>
<div>
<label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">iOSバージョン<span style="color:{{ theme.textSecondary }};font-weight:500;">(任意)</span></label>
<input type="text" value="{{ fields.iosVersion }}" onChange="{{ onChangeIosVersion }}" placeholder="例: 17.4" style="width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid {{ theme.border }};background:{{ theme.card }};color:{{ theme.text }};font-size:15px;font-family:inherit;"/>
</div>
</div>

<div>
<label style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">お問い合わせ内容<span style="color:{{ theme.accent }};font-weight:700;"> *</span></label>
<textarea value="{{ fields.message }}" onChange="{{ onChangeMessage }}" placeholder="内容をできるだけ詳しくご記入ください。" rows="6" style="width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid {{ messageBorder }};background:{{ theme.card }};color:{{ theme.text }};font-size:15px;font-family:inherit;resize:vertical;"></textarea>
<sc-if value="{{ errors.message }}" hint-placeholder-val="{{ false }}">
<p style="margin:6px 0 0;font-size:12px;color:#E0405C;">{{ errors.message }}</p>
</sc-if>
</div>

<sc-if value="{{ showErrorBanner }}" hint-placeholder-val="{{ false }}">
<div style="padding:14px 16px;border-radius:10px;background:rgba(224,64,92,0.1);border:1px solid rgba(224,64,92,0.3);color:#E0405C;font-size:13px;line-height:1.6;">{{ submitErrorMessage }}</div>
</sc-if>

<button type="submit" disabled="{{ submitting }}" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;padding:16px 28px;border:none;border-radius:12px;background:{{ submitBg }};color:#fff;font-weight:700;font-size:15px;cursor:{{ submitCursor }};font-family:inherit;">
<sc-if value="{{ submitting }}" hint-placeholder-val="{{ false }}">
<span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:sp-spin 0.7s linear infinite;"></span>
</sc-if>
{{ submitLabel }}
</button>

</form>
</sc-if>

<sc-if value="{{ showSuccess }}" hint-placeholder-val="{{ false }}">
<div style="text-align:center;padding:56px 24px;">
<div style="width:56px;height:56px;border-radius:50%;background:{{ theme.accentSoft }};color:{{ theme.accent }};display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
</div>
<h2 style="font-size:19px;font-weight:700;margin:0 0 8px;">送信が完了しました</h2>
<p style="font-size:14px;color:{{ theme.textSecondary }};margin:0;line-height:1.7;">お問い合わせありがとうございます。<br/>内容を確認の上、必要に応じてご返信いたします。</p>
</div>
</sc-if>

</div>
</section>

<footer class="lp-footer" style="padding:40px 56px;border-top:1px solid {{ theme.border }};">
<div style="max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
<span style="font-size:13px;color:{{ theme.textSecondary }};">© 2026 Makoto. MuLy</span>
<div style="display:flex;gap:24px;align-items:center;">
<a href="https://github.com/AgeFactory24/MusicLibraryApp" target="_blank" rel="noopener" style="font-size:13px;color:{{ theme.textSecondary }};text-decoration:none;display:flex;align-items:center;gap:6px;">
<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
GitHub
</a>
<a href="/privacy/" style="font-size:13px;color:{{ theme.textSecondary }};text-decoration:none;">プライバシーポリシー</a>
<a href="/terms/" style="font-size:13px;color:{{ theme.textSecondary }};text-decoration:none;">利用規約</a>
<a href="/commercial-transactions/" style="font-size:13px;color:{{ theme.textSecondary }};text-decoration:none;">特定商取引法に基づく表記</a>
<span style="font-size:13px;color:{{ theme.accent }};font-weight:700;">お問い合わせ</span>
</div>
</div>
</footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Firebase Functions のお問い合わせ送信エンドポイント。
  // Hostingとは別プロジェクトのCloud Run URLを直接呼び出す。
  static FUNCTION_URL = 'https://submitcontact-usbsxooata-uc.a.run.app';

  state = {
    systemDark: false,
    fields: { name: '', email: '', category: '', appVersion: '', iosVersion: '', message: '' },
    errors: {},
    submitting: false,
    result: null, // null | 'success' | 'error'
    submitErrorMessage: ''
  };

  componentDidMount() {
    if (window.matchMedia) {
      const mql = window.matchMedia('(prefers-color-scheme: dark)');
      this.setState({ systemDark: mql.matches });
      if (mql.addEventListener) mql.addEventListener('change', (e) => this.setState({ systemDark: e.matches }));
    }
  }

  setField = (key, value) => {
    this.setState((s) => ({ fields: { ...s.fields, [key]: value }, errors: { ...s.errors, [key]: undefined } }));
  };

  onChangeName = (e) => this.setField('name', e.target.value);
  onChangeEmail = (e) => this.setField('email', e.target.value);
  onChangeCategory = (e) => this.setField('category', e.target.value);
  onChangeAppVersion = (e) => this.setField('appVersion', e.target.value);
  onChangeIosVersion = (e) => this.setField('iosVersion', e.target.value);
  onChangeMessage = (e) => this.setField('message', e.target.value);

  // 入力チェック: 必須項目 + メールアドレスの形式
  validate(fields) {
    const errors = {};
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!fields.email.trim()) {
      errors.email = 'メールアドレスを入力してください。';
    } else if (!emailPattern.test(fields.email.trim())) {
      errors.email = 'メールアドレスの形式が正しくありません。';
    }
    if (!fields.category) {
      errors.category = 'お問い合わせ種別を選択してください。';
    }
    if (!fields.message.trim()) {
      errors.message = 'お問い合わせ内容を入力してください。';
    }
    return errors;
  }

  handleSubmit = async (e) => {
    e.preventDefault();
    if (this.state.submitting) return;
    const errors = this.validate(this.state.fields);
    if (Object.keys(errors).length > 0) {
      this.setState({ errors });
      return;
    }
    this.setState({ submitting: true, errors: {}, result: null, submitErrorMessage: '' });
    const f = this.state.fields;
    try {
      const appCheckToken = window.__getAppCheckToken ? await window.__getAppCheckToken() : null;
      if (!appCheckToken) {
        throw new Error('APP_CHECK_UNAVAILABLE');
      }
      const res = await fetch(Component.FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Firebase-AppCheck': appCheckToken
        },
        body: JSON.stringify({
          name: f.name,
          email: f.email,
          category: f.category,
          appVersion: f.appVersion,
          iosVersion: f.iosVersion,
          message: f.message
        })
      });
      if (!res.ok) throw new Error('HTTP_' + res.status);
      this.setState({ submitting: false, result: 'success' });
    } catch (err) {
      this.setState({
        submitting: false,
        result: 'error',
        submitErrorMessage: this.submitFailureMessage(err)
      });
    }
  };

  submitFailureMessage(err) {
    const message = err && err.message ? err.message : '';
    if (window.location.protocol === 'file:') {
      return 'ローカルファイルからは送信できません。https://muly.club/support.html からお試しください。';
    }
    if (message === 'APP_CHECK_UNAVAILABLE' || message === 'HTTP_401') {
      return 'セキュリティ確認に失敗しました。広告ブロックや追跡防止を一時的に解除して、ページを再読み込みしてからお試しください。';
    }
    if (message === 'HTTP_500') {
      return 'メール送信サーバーでエラーが発生しました。お手数ですが muly.support@gmail.com へ直接ご連絡ください。';
    }
    return '送信に失敗しました。時間をおいて再度お試しください。解決しない場合は muly.support@gmail.com へ直接ご連絡ください。';
  }

  renderVals() {
    const s = this.state;
    const dark = s.systemDark;
    const theme = dark ? {
      bg: '#0B0B0D', bgAlt: '#131316', card: '#1B1B1E', border: 'rgba(255,255,255,0.08)',
      text: '#F5F5F7', textSecondary: '#9A9AA0', accent: '#FF5C82', accentSoft: 'rgba(255,92,130,0.15)'
    } : {
      bg: '#FFFFFF', bgAlt: '#FAFAFA', card: '#F5F5F7', border: 'rgba(0,0,0,0.08)',
      text: '#111111', textSecondary: '#6B6B6F', accent: '#F03864', accentSoft: 'rgba(240,56,100,0.08)'
    };

    const errorColor = '#E0405C';
    const emailBorder = s.errors.email ? errorColor : theme.border;
    const categoryBorder = s.errors.category ? errorColor : theme.border;
    const messageBorder = s.errors.message ? errorColor : theme.border;

    return {
      theme,
      fields: s.fields,
      errors: s.errors,
      emailBorder, categoryBorder, messageBorder,
      onChangeName: this.onChangeName,
      onChangeEmail: this.onChangeEmail,
      onChangeCategory: this.onChangeCategory,
      onChangeAppVersion: this.onChangeAppVersion,
      onChangeIosVersion: this.onChangeIosVersion,
      onChangeMessage: this.onChangeMessage,
      handleSubmit: this.handleSubmit,
      submitting: s.submitting,
      submitLabel: s.submitting ? '送信中…' : '送信する',
      submitBg: s.submitting ? theme.textSecondary : theme.accent,
      submitCursor: s.submitting ? 'default' : 'pointer',
      showErrorBanner: s.result === 'error',
      submitErrorMessage: s.submitErrorMessage,
      showForm: s.result !== 'success',
      showSuccess: s.result === 'success'
    };
  }
}

</script>
</body>
</html>
